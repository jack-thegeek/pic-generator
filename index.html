<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">
    <title>荣誉证书</title>

    <script src="https://cdn.jsdelivr.net/npm/html-to-image@1.11.13/dist/html-to-image.min.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: system-ui, Roboto, "Helvetica Neue", Arial, "PingFang SC", sans-serif;
            background: linear-gradient(135deg, #f6f7fb, #eef1f6);
            min-height: 100vh;
            padding: 1rem;
            color: #333;
        }

        .wrap {
            width: 100%;
            margin: auto;
            max-width: 768px;
        }

        .toolbar {
            margin: 20px auto;
            background: rgba(255, 255, 255, 0.92);
            border-radius: 18px;
            padding: 12px;
            display: flex;
            gap: 12px;
            justify-content: center;
            align-items: center;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08), 0 2px 6px rgba(0, 0, 0, 0.05);
        }

        .toolbar input {
            flex: 1;
            width: 60%;
            height: 50px;
            border: none;
            outline: none;
            border-radius: 14px;
            padding: 0 12px;
            font-size: 16px;
            background: #f3f5f9;
            color: #333;
            box-shadow: inset 0 0 0 2px transparent;
        }

        .toolbar input:focus {
            background: #fff;
            box-shadow: inset 0 0 0 2px #1976d2, 0 0 0 4px rgba(25, 118, 210, .12);
        }

        .toolbar input::placeholder {
            color: #999;
        }

        .download-btn {
            width: 30%;
            height: 50px;
            padding: 0 12px;
            border: none;
            border-radius: 14px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: all .25s ease;
            background: linear-gradient(135deg, #ff9800, #ffb74d);
            color: white;
            box-shadow: 0 6px 16px rgba(255, 152, 0, .3);
        }

        .download-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(255, 152, 0, .35);
        }

        .certificate {
            width: 100%;
            height: 100%;
            position: relative;
        }

        #studentName {
            position: absolute;
            left: 25%;
            transform: translateX(-50%);
            top: 37.5%;
            font-weight: bold;
            color: #222;
            font-size: clamp(11px, calc(20 * 100vw / 768), 20px);
        }

    </style>
</head>
<body>

<div class="wrap">
    <div class="toolbar">
        <input id="nameInput" type="text" placeholder="请输入姓名"/>
        <button class="download-btn" onclick="download()">
            下载图片
        </button>
    </div>
    <div class="certificate" id="certificate">
        <!--<img src="https://s41.ax1x.com/2026/06/01/pmAtHAS.jpg" alt="" width="100%">-->
        <img src="./cert.jpg" alt="" width="100%">
        <span id="studentName">张三</span>
    </div>
</div>

<script>
    const nameInput = document.getElementById('nameInput');
    const studentName = document.getElementById('studentName');

    nameInput.addEventListener('input', function () {
        const name = this.value.trim();
        studentName.innerText = name || '张三';
    });

    function download() {
        const certificate = document.getElementById('certificate');

        htmlToImage
            .toJpeg(certificate, {quality: 0.95, pixelRatio: 2, canvasWidth: 1772, canvasHeight: 1182})
            .then(function (dataUrl) {
                const link = document.createElement('a');
                const name = studentName.innerText || '荣誉证书';
                link.download = `${name}-荣誉证书.jpg`;
                link.href = dataUrl;
                link.click();
            });
    }
</script>

</body>
</html>
